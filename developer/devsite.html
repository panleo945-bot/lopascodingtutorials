<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Launcher</title>
</head>
<body>

    <div class="container">
        <h2>Website Launcher</h2>
        <p>Choose environment:</p>
        
        <div class="btn-container">
            <button class="btn-blank" onclick="launchAboutBlank()">Launch in about:blank</button>
            <button class="btn-blob" onclick="launchBlob()">Launch in Blob URL</button>
            <button class="btn-normal" onclick="launchDirect()">Launch through this page</button>
        </div>
    </div>
    <script>
        const predefinedHTML = fetch("./site.html").then(response => {
            if (!response.ok) {
                throw new Error(`Could not load site.html: ${response.status}`);
            }
            return response.text();
        });

        function launchDirect() {
            predefinedHTML.then(html => {
                document.open();
                document.write(html);
                document.close();
            }).catch(error => alert(error.message));
        }

        function launchAboutBlank() {
            const win = window.open("about:blank", "_blank");
            if (win) {
                predefinedHTML.then(html => {
                    win.document.open();
                    win.document.write(html);
                    win.document.close();
                }).catch(error => {
                    win.close();
                    alert(error.message);
                });
            } else {
                alert("Popup blocked! Please allow popups for this dashboard.");
            }
        }

        function launchBlob() {
            predefinedHTML.then(html => {
                const blob = new Blob([html], { type: "text/html" });
                const blobUrl = URL.createObjectURL(blob);
                const win = window.open(blobUrl, "_blank");
                if (!win) {
                    alert("Popup blocked! Please allow popups for this dashboard.");
                }
            }).catch(error => alert(error.message));
        }
    </script>

</body>
</html>
